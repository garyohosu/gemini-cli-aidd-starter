description = "現在の変更内容を簡潔にレビューする入口コマンド"

prompt = '''
現在の変更内容と関連ドキュメントを確認し、2段階でレビューしてください。

---

## フェーズ1: ラバーダック自己説明

レビューの前に、今の会話を知らない第三者に説明するつもりで成果物を自己説明する。
単一セッションで実装とレビューを続けて行う場合、会話文脈を引きずったまま判断しやすい。
この自己説明はその文脈リセットが目的である。

以下の観点を順番に答える:
1. この変更・成果物の目的は何か
2. 入力と出力は何か
3. 正常系はどう動くか
4. 異常系・例外系・境界条件はどう扱うか
5. 未確定事項は何か
6. 会話の補足説明を前提にしている箇所はないか
7. 不足しているテスト観点はないか

未確定事項があれば `QandA.md` に記録する。

---

## フェーズ2: レビュー

フェーズ1の自己説明を踏まえ、以下の優先観点でレビューする:
1. 前フェーズとの重大な矛盾
2. 必須項目の欠落
3. 明確な不具合
4. Mermaid 構文エラー
5. テスト観点不足

出力形式:
- Self-explanation summary（フェーズ1の要約）
- Findings
- Required fixes
- Review status: APPROVED または REQUEST_CHANGES

追加の確認対象:
{{args}}
'''
