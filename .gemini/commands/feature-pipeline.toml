description = "仕様確認から設計・実装・レビューまでを段階的に進める入口コマンド"

prompt = '''
あなたはこのリポジトリの実務担当です。
まず現在のワークスペースを確認し、`GEMINI.md` のルールに従ってフェーズを判断してください。

進め方:
